<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">

    <title>Vincent's Aespa Photocard Inventory</title>
</head>
<body>
    <div class="">
        <div class="container hero">
            <div class="row d-flex align-items-center justify-content-center pt-5">
                <div class="col-12">
                    <h1 class="text-center share-tech-regular">Vincent's Aespa Photocard Inventory</h1>
                    <p class="collection-note">
                        Browse all of aespa photocards and track your collection! Any saves will only be visible to your local browser and won't affect other users.
                    </p>
                </div>
            </div>
        </div>

        <div class="container">
            <div class="row d-flex align-items-center justify-content-center pt-3">
                <div class="btn-group flex-wrap filter-buttons" role="group">
                    <button type="button" class="btn btn-outline-primary filter-button active" data-filter="All">All</button>
                    <button type="button" class="btn btn-outline-primary filter-button" data-filter="Karina">Karina</button>
                    <button type="button" class="btn btn-outline-primary filter-button" data-filter="Winter">Winter</button>
                    <button type="button" class="btn btn-outline-primary filter-button" data-filter="Giselle">Giselle</button>
                    <button type="button" class="btn btn-outline-primary filter-button" data-filter="Ningning">Ningning</button>
                </div>
            </div>
        </div>

        <div class="container text-center mt-3">
            <h6 id="totalCardCount" class="share-tech-regular-v2">Total Cards: 0</h6>
        </div>
    <div class="container mt-3">
        <label for ="collectionProgress" class="form-label">
            Collection completion
        </label>
        <progress id="collectionProgress" max="100" value="0"></progress>
        <p id="collectionProgressText" class="mt-1"></p>
    </div>

    <div class="container mt-3">
        <div class="row g-3">
            <div class="col-12 col-md-8">
                <label for="cardSearch" class="form-label">Search cards</label>
                <input
                    id="cardSearch"
                    class="form-control searchBar"
                    type="search"
                    placeholder="Search by member, release, or version"
                >
            </div>
    
            <div class="col-12 col-md-4">
                <label for="themeSelector" class="form-label">Theme</label>
                <select id="themeSelector" class="form-select">
                    <option value="minimal">Minimal</option>
                    <option value="metallic">Metallic</option>
                    <option value="pastel">Pastel</option>
                </select>
            </div>
        </div>
    </div>
    <div class="container mt-3">
        <div class="row g-3">
            <div class="col-12 col-md-6">
                <label for="releaseFilter" class="form-label">Release</label>
                <select id="releaseFilter" class="form-select">
                    <option value="all">All releases</option>
                </select>
            </div>
            <div class="col-12 col-md-6">
                <label for="ownershipFilter" class="form-label">Ownership</label>
                <select id="ownershipFilter" class="form-select">
                    <option value="all">All cards</option>
                    <option value="owned">Owned</option>
                    <option value="missing">Not owned</option>
                </select>
            </div>
        </div>
    </div>
        <div class ="container text-center mt-3">
            <button type="button" id="resetFilter" class="btn btn-outline-secondary">
                Reset filters
            </button>
            <button type="button" id="exportCollection" class="btn btn-outline-secondary">
                Export collection
            </button>
            <button type="button" id="importCollection" class="btn btn-outline-secondary">
                Import collection
            </button>
            <input type="file" id="importCollectionFile" accept=".json,application/json" hidden>
        </div>
        <p id="catalogStatus" class ="container text-center mt-3" role="status">
            Loading cards...
        </p>
        <div id="cardList" class="container pt-5">
            <div id="cardRow" class="row justify-content-center g-4"></div>
        </div>
        <p id="noResults" class="text-center mt-4" style="display: none;">No results found.</p>
    </div>
    <dialog id="cardViewer" aria-labelledby="cardViewerTitle">
        <button type="button" id="closeCardViewer" class="btn btn-outline-secondary">
            Close
        </button>
        <h2 id="cardViewerTitle"></h2>
            <img id="cardViewerImage" alt="">
            <p id="cardViewerDetails"></p>
            <div  class ="d-flex justify-content-between align-items-center gap-2 mt-3">
                <button type="button" id="previousCard" class ="btn btn-outline-primary">
                    Previous
                </button>

                <span id="viewerPosition" aria-live="polite"></span>

                <button type="button" id="nextCard" class ="btn btn-outline-primary">
                    Next
                </button>
            </div>
        <p class="viewer-hint">
            Use ← and → to browse. Press Escape to close.
        </p>
    </dialog>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>
</html>
